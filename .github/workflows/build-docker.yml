name: Build Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "指定上游版本 tag（如 v3.8.4），留空则构建当前 master"
        required: false
        default: ""
  schedule:
    - cron: "30 20 * * *"   # 北京时间每天 04:30 检查上游新版本

permissions:
  contents: write

concurrency:
  group: build-docker
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-590g36lcopret480.cn-chengdu.personal.cr.aliyuncs.com
  ACR_REPO: heiok_top/siyuan_unlock
  UNLOCK_GIT: https://github.com/LnameBF/siyuan-unlock.git
  UPSTREAM_GIT: https://github.com/siyuan-note/siyuan.git

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要完整历史，用于从 WS 修复 commit 提取补丁

      # 定时任务检查上游最新版；手动触发且填了版本号时同步到指定版本。
      # 同步前预检解锁补丁能否套用，失败则整体回滚、保持当前可用版本不变。
      - name: Sync upstream version
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -e
          ORIG_HEAD=$(git rev-parse HEAD)

          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET=$(curl -fsSL https://api.github.com/repos/siyuan-note/siyuan/releases/latest | jq -r '.tag_name')
          else
            TARGET="$DISPATCH_VERSION"
          fi
          TARGET="${TARGET#v}"; TARGET="v$TARGET"
          CURRENT="v$(grep -oP 'const Ver = "\K[^"]+' kernel/util/working.go)"
          echo "current=$CURRENT target=$TARGET"
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "UP_TO_DATE=true" >> "$GITHUB_ENV"
            echo "已是最新版本，跳过同步与构建"
            exit 0
          fi

          # 提取 fork 自有改动（BFCache WS 修复）作为补丁
          WS_COMMIT=$(git log --format=%H --grep="BFCache freeze" -1)
          git diff "${WS_COMMIT}^" "${WS_COMMIT}" > /tmp/ws-bfcache.patch

          # 源码树整体重置到上游目标版本（保留 fork 历史，避免无关历史合并冲突）
          git remote add upstream "$UPSTREAM_GIT" 2>/dev/null || git remote set-url upstream "$UPSTREAM_GIT"
          git fetch upstream "refs/tags/$TARGET:refs/tags/$TARGET" --depth=1
          git read-tree -u --reset "refs/tags/$TARGET"
          # 流水线文件与构建说明文档不在上游 tag 里，需从当前历史恢复，避免同步后被删
          git checkout HEAD -- .github/workflows/build-docker.yml .github/BUILD.md

          # 重新套用 WS 修复（幂等：已存在时跳过，普通应用失败再试三方合并）
          if git apply --check /tmp/ws-bfcache.patch 2>/dev/null; then
            git apply /tmp/ws-bfcache.patch
          elif git apply --check --reverse /tmp/ws-bfcache.patch 2>/dev/null; then
            echo "WS 修复已存在，跳过重复套用"
          elif git apply -3 /tmp/ws-bfcache.patch; then
            echo "WS 修复已通过三方合并套用"
          else
            echo "::error::BFCache WS 修复补丁在 $TARGET 上冲突，请手动适配 app/src/layout/Model.ts"
            git reset --hard "$ORIG_HEAD"
            exit 1
          fi

          # 预检：解锁补丁必须能在新版本上套用，否则回滚保持当前版本
          if [ ! -d /tmp/siyuan-unlock ]; then
            git clone --depth=1 "$UNLOCK_GIT" /tmp/siyuan-unlock
          fi
          for p in disable-update default-config mock-vip-user hide-account-entry; do
            if ! git apply --check "/tmp/siyuan-unlock/patches/siyuan/$p.patch"; then
              echo "::warning::解锁补丁 $p 无法套用到 $TARGET，已回滚保持 $CURRENT，请先为 $TARGET 适配补丁"
              git reset --hard "$ORIG_HEAD"
              echo "UP_TO_DATE=true" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream $TARGET"
          git push origin master

      - name: Apply unlock patches
        if: env.UP_TO_DATE != 'true'
        run: |
          set -e
          if [ ! -d /tmp/siyuan-unlock ]; then
            git clone --depth=1 "$UNLOCK_GIT" /tmp/siyuan-unlock
          fi
          VER=$(grep -oP 'const Ver = "\K[^"]+' kernel/util/working.go)
          for p in disable-update default-config mock-vip-user hide-account-entry; do
            echo "applying $p"
            git apply -v "/tmp/siyuan-unlock/patches/siyuan/$p.patch"
          done
          echo "IMAGE_VERSION=v$VER" >> "$GITHUB_ENV"

      - name: Build image
        if: env.UP_TO_DATE != 'true'
        run: |
          printf '*\n!Dockerfile\n!app\n!kernel\n!LICENSE\n!THIRD_PARTY_NOTICES.md\n' > .dockerignore
          docker build \
            -t "$ACR_REGISTRY/$ACR_REPO:$IMAGE_VERSION" \
            -t "$ACR_REGISTRY/$ACR_REPO:latest" .

      - name: Push to Aliyun ACR
        if: env.UP_TO_DATE != 'true'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "$ACR_REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          docker push "$ACR_REGISTRY/$ACR_REPO:$IMAGE_VERSION"
          docker push "$ACR_REGISTRY/$ACR_REPO:latest"
